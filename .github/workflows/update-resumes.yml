name: Publish updated resume PDFs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-resumes.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install conversion dependencies
        run: |
          python -m pip install python-docx
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-liberation
      - name: Build India and GCC resumes
        run: |
          python tools/build_resumes.py
          libreoffice -env:UserInstallation=file:///tmp/lo-resumes --headless --convert-to pdf --outdir . Salman_Pawaskar_India_Resume_Updated.docx Salman_Pawaskar_GCC_Resume_Updated.docx
          mv Salman_Pawaskar_India_Resume_Updated.pdf Salman_Pawaskar_India_Resume.pdf
          mv Salman_Pawaskar_GCC_Resume_Updated.pdf Salman_Pawaskar_GCC_Resume.pdf
          test "$(pdfinfo Salman_Pawaskar_India_Resume.pdf | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo Salman_Pawaskar_GCC_Resume.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext Salman_Pawaskar_India_Resume.pdf - | grep -q 'PORTFOLIO'
          pdftotext Salman_Pawaskar_GCC_Resume.pdf - | grep -q 'PORTFOLIO'
          ! pdftotext Salman_Pawaskar_India_Resume.pdf - | grep -Eiq 'immediate joiner|immediate availability'
          ! pdftotext Salman_Pawaskar_GCC_Resume.pdf - | grep -Eiq 'immediate joiner|immediate availability'
      - name: Replace existing website PDF downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Salman_Pawaskar_India_Resume.pdf Salman_Pawaskar_GCC_Resume.pdf
          if ! git diff --staged --quiet; then
            git commit -m "Replace India and GCC resume downloads with updated PDFs"
            git push
          fi
